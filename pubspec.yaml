name: orbitrelay_client_flutter
description: "Minimal realtime Canvas client for OrbitRelay development mode."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  crypto: 3.0.7
  flutter:
    sdk: flutter
  http: 1.6.0
  pdfrx: 2.4.7
  uuid: ^4.5.3
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - test/fixtures/alignment_rotations.pdf
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
